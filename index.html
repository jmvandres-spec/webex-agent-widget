<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webex CC - Tiempo Real (WebSocket)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title svg { width: 18px; height: 18px; }

    /* Indicador de conexión WebSocket */
    .ws-status {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #e5e7eb;
    }
    .ws-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
    }
    .ws-connected .ws-dot { background: #10b981; animation: pulse 2s infinite; }
    .ws-connecting .ws-dot { background: #f59e0b; }
    .ws-disconnected .ws-dot { background: #ef4444; }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .summary {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.15s;
    }

    .badge-all       { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }
    .badge-available { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
    .badge-idle      { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .badge-offline   { background: #f3f4f6; color: #374151; border-color: #d1d5db; }
    .badge.active { filter: brightness(0.92); border-color: currentColor; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .avatar-wrap { position: relative; }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #e5e7eb;
      background-size: cover;
      background-position: center;
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .dot-available { background: #10b981; }
    .dot-idle      { background: #f59e0b; }
    .dot-offline   { background: #9ca3af; }

    .agent-name {
      font-size: 12px;
      font-weight: 600;
      color: #111827;
      text-align: center;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agent-queue {
      font-size: 10px;
      color: #4b5563;
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .pill-available { background: #d1fae5; color: #065f46; }
    .pill-idle      { background: #fef3c7; color: #92400e; }
    .pill-offline   { background: #f3f4f6; color: #6b7280; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
    </svg>
    Webex CC Live Stream
  </div>

  <div class="ws-status ws-disconnected" id="wsStatus">
    <span class="ws-dot"></span>
    <span id="wsStatusText">Desconectado</span>
  </div>
</div>

<div class="summary" id="summary"></div>
<div class="grid" id="grid"></div>

<script>
const CONFIG = {
  // Tu endpoint que proporciona la lista inicial y/o el Token de Webex
  proxyUrl: 'https://webex-agent-proxy.jmvandres.workers.dev/',
  // URL global del servicio WebSocket de Webex (WSS)
  webexWsUrl: 'wss://wdm-a.webexcontent.com/wdm/api/v1/registration'
};

const STATUS_MAP = {
  'active':   { label: 'Disponible', cls: 'available' },
  'inactive': { label: 'Inactivo',   cls: 'idle' },
  'unknown':  { label: 'Desconectado', cls: 'offline' }
};

const AVATAR_COLORS = [
  ['#dbeafe','#1e40af'], ['#d1fae5','#065f46'], ['#fce7f3','#9d174d'], ['#fef3c7','#78350f']
];

let agentsMap = new Map(); // Guardamos los agentes indexados por ID para actualización ultra rápida
let activeFilter = 'all';
let socket = null;

// 1. CARGA INICIAL DE AGENTES (HTTP)
async function init() {
  try {
    updateWsStatus('connecting', 'Cargando agentes...');
    const res = await fetch(CONFIG.proxyUrl);
    const data = await res.json();
    const list = data.agents || [];

    list.forEach((agent, i) => {
      const rawStatus = String(agent.status).toLowerCase().trim();
      const info = STATUS_MAP[rawStatus] || STATUS_MAP['unknown'];
      const parts = agent.name.split(' ');
      const initials = ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
      const colors = AVATAR_COLORS[i % AVATAR_COLORS.length];

      agentsMap.set(agent.id, {
        id: agent.id,
        name: agent.name,
        initials,
        avatar: agent.avatar,
        queue: agent.email ? agent.email.split('@')[1] : 'Sin Cola',
        status: info.cls,
        label: info.label,
        bg: colors[0],
        fg: colors[1]
      });
    });

    renderUI();
    
    // Si tu Worker expone o añade el Bearer token en las cabeceras/propiedades de la respuesta,
    // úsalo aquí. (Reemplaza 'TU_TOKEN_AQUÍ' si tu worker te lo envía de vuelta).
    const token = data.token || 'TU_TOKEN_DE_WEBEX_AQUÍ'; 
    connectWebSocket(token);

  } catch (err) {
    console.error(err);
    updateWsStatus('disconnected', 'Error de inicialización');
  }
}

// 2. CONEXIÓN POR WEBSOCKET (TIEMPO REAL)
function connectWebSocket(token) {
  if (!token || token === 'TU_TOKEN_DE_WEBEX_AQUÍ') {
    updateWsStatus('disconnected', 'Falta Token de tiempo real');
    return;
  }

  socket = new WebSocket(CONFIG.webexWsUrl);

  socket.onopen = () => {
    updateWsStatus('connected', 'Tiempo Real Activo');
    
    // Autenticación y Suscripción al stream de Webex
    const registerPayload = {
      id: crypto.randomUUID(),
      type: "register",
      headers: { Authorization: `Bearer ${token}` },
      body: { forceConnect: true, deviceType: "DESKTOP" }
    };
    socket.send(JSON.stringify(registerPayload));
  };

  socket.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      
      // Capturamos el evento de cambio de presencia / estado del Contact Center de Cisco
      if (msg.activity && msg.activity.verb === 'update' || msg.type === 'presence.change') {
        const actorId = msg.actor?.id || msg.body?.personId;
        const newRawStatus = msg.body?.status || msg.activity?.object?.status;

        if (actorId && agentsMap.has(actorId) && newRawStatus) {
          const agent = agentsMap.get(actorId);
          const info = STATUS_MAP[newRawStatus.toLowerCase().trim()] || STATUS_MAP['unknown'];
          
          // Actualizamos únicamente los campos mutados en memoria
          agent.status = info.cls;
          agent.label = info.label;
          
          // Si el evento reporta cambio de cola de atención (Call Center Event)
          if(msg.body?.queueName) {
             agent.queue = msg.body.queueName;
          }

          agentsMap.set(actorId, agent);
          
          // Re-renderizado instantáneo sin parpadeos
          renderUI();
        }
      }
    } catch (e) {
      console.error("Error procesando mensaje de WebSocket:", e);
    }
  };

  socket.onclose = () => {
    updateWsStatus('disconnected', 'Reconectando...');
    setTimeout(() => connectWebSocket(token), 5000); // Auto-reconexión automática
  };
}

function updateWsStatus(cls, text) {
  const el = document.getElementById('wsStatus');
  el.className = `ws-status ws-${cls}`;
  document.getElementById('wsStatusText').textContent = text;
}

function renderUI() {
  const agentsArray = Array.from(agentsMap.values());
  
  // 1. Renderizar Contadores
  const counts = { all: agentsArray.length, available: 0, idle: 0, offline: 0 };
  agentsArray.forEach(a => counts[a.status] !== undefined && counts[a.status]++);
  
  const labels = { all: 'Todos', available: 'Disponibles', idle: 'Inactivos', offline: 'Fuera' };
  document.getElementById('summary').innerHTML = Object.entries(labels).map(([key, label]) =>
    `<span class="badge badge-${key} ${activeFilter === key ? 'active' : ''}" onclick="filterData('${key}')">${label} <b>${counts[key]}</b></span>`
  ).join('');

  // 2. Renderizar Cuadrícula
  const filtered = activeFilter === 'all' ? agentsArray : agentsArray.filter(a => a.status === activeFilter);
  const grid = document.getElementById('grid');
  
  grid.innerHTML = filtered.map(a => `
    <div class="card" id="card-${a.id}">
      <div class="avatar-wrap">
        ${a.avatar ? `<div class="avatar" style="background-image:url('${a.avatar}')"></div>` : `<div class="avatar" style="background:${a.bg};color:${a.fg}">${a.initials}</div>`}
        <span class="status-dot dot-${a.status}"></span>
      </div>
      <span class="agent-name">${a.name}</span>
      <span class="agent-queue">🎧 ${a.queue}</span>
      <span class="status-pill pill-${a.status}">${a.label}</span>
    </div>
  `).join('');
}

function filterData(filter) {
  activeFilter = filter;
  renderUI();
}

init();
</script>
</body>
</html>
